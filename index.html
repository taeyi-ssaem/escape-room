<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소수의 나눗셈 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 생태 연구 기지 관찰 일지 — 모눈 종이 위에 표본 라벨, 자물쇠 상자 */
:root{
  --paper:#f4f6f1; --grid:rgba(26,84,96,.09); --ink:#1c2a33; --ink-2:#51616b;
  --sea:#11686c; --sea-2:#d9ecea; --amber:#d98a1f; --amber-2:#fbeed6;
  --leaf:#2f8448; --leaf-2:#dcefdf; --berry:#bf3f37; --berry-2:#f8e1de;
  --card:#ffffff; --label:#fffaf0; --line:#cfd8d6;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost{border-color:var(--line);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* 시작 화면 */
.start{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-top:4vh}
.room,.puzzle,.result,.teacher{grid-template-columns:minmax(0,1fr)}
.eyebrow{font-family:var(--f-num);font-size:13px;letter-spacing:.12em;color:var(--sea)}
.start h1{font-size:clamp(40px,8vw,72px);color:var(--ink)}
.start h1 em{font-style:normal;color:var(--sea)}
.dossier{background:var(--label);border:1.5px solid var(--ink);border-radius:4px;padding:20px;box-shadow:6px 6px 0 var(--sea-2);display:grid;gap:14px;max-width:640px}
.dossier p{margin:0}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.form input{font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid var(--ink-2);border-radius:8px;background:#fff;color:var(--ink);min-width:0;width:100%}
@media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form label:last-child{grid-column:1/-1}}
.err{color:var(--berry);font-size:15px;min-height:1.2em}
.footer-links{display:flex;gap:10px;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;max-width:640px}
.lvl{text-align:left;border:2px solid var(--line);border-radius:10px;background:rgba(255,255,255,.75);padding:14px 16px;display:grid;gap:4px;min-width:0}
.lvl b{font-family:var(--f-display);font-weight:400;font-size:24px}
.lvl span{font-size:14px;color:var(--ink-2)}
.lvl .lvl-tag{justify-self:start;font-family:var(--f-num);font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--sea-2);color:var(--sea)}
.lvl-adv .lvl-tag{background:#e4e0f2;color:#4b3f8f}
.lvl .lvl-rooms{font-size:13px}
.lvl.on{border-color:var(--sea);background:#fff;box-shadow:4px 4px 0 var(--sea-2)}
.lvl-adv.on{border-color:#4b3f8f;box-shadow:4px 4px 0 #e4e0f2}

/* 상단 진행 막대 */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(244,246,241,.94);backdrop-filter:blur(4px);border-bottom:1.5px solid var(--ink);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.rpill{font-size:13px;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink-2);background:#fff}
.rpill.here{border-color:var(--sea);color:var(--sea);font-weight:700}
.rpill.done{background:var(--leaf-2);border-color:var(--leaf);color:var(--leaf)}
.stats{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.stats .chip{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.cards{display:flex;gap:4px}
.ncard{width:26px;height:34px;border-radius:4px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;background:var(--amber-2)}
.ncard.empty{border-style:dashed;border-color:var(--line);background:transparent;color:transparent}
.sync{font-size:12px;color:var(--ink-2)}

/* 방 화면 */
.room{display:grid;gap:20px;padding-top:20px}
.room-head{display:grid;gap:4px}
.room-head .eyebrow{color:var(--amber)}
.room-head h2{font-size:clamp(30px,5vw,44px)}
.log{background:var(--label);border-left:6px solid var(--sea);padding:14px 18px;border-radius:0 6px 6px 0;max-width:720px}
.log p{margin:0}
.stage{background:#0b0f1a;border:4px solid #121826;border-radius:14px;overflow:hidden;line-height:0;max-width:860px;width:100%;box-shadow:0 8px 0 #121826,0 18px 34px rgba(18,24,38,.35)}
#scene{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
.status{min-height:2.8em;font-weight:700;max-width:820px;padding:8px 12px;border-radius:8px;background:#fff;border:1.5px solid var(--line)}
.status.toast{background:var(--amber-2);border-color:var(--amber);color:#8a5410}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;max-width:820px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button,.actbtn{border:2px solid var(--ink);background:#fff;border-radius:12px;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,.pad button.on{background:var(--sea-2)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.actbtn{width:96px;height:96px;border-radius:50%;background:var(--amber);border-color:var(--amber);color:#fff;font-family:var(--f-display);font-size:22px;box-shadow:0 4px 0 #a5660f}
.keys{font-size:14px;color:var(--ink-2);flex:1 1 200px}
.keys kbd{font-family:var(--f-num);border:1.5px solid var(--ink-2);border-bottom-width:3px;border-radius:5px;padding:0 6px;background:#fff;font-size:13px}
.note-btn{justify-self:start}
.note{background:#fff;border:1.5px solid var(--sea);border-radius:8px;padding:14px 18px;max-width:720px}
.note h3{font-size:20px;color:var(--sea);margin-bottom:6px}
.note p{margin:0}

/* 문제 화면 */
.puzzle{display:grid;gap:18px;padding-top:20px}
.pz-head{display:grid;gap:6px}
.pz-head h2{font-size:clamp(26px,4.4vw,36px)}
.instr{font-weight:700;color:var(--sea)}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:18px;display:grid;gap:16px;min-width:0}
.steplabel{font-family:var(--f-num);font-size:12px;letter-spacing:.1em;color:var(--amber)}
.q{display:grid;gap:10px}
.q .qt{font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;text-align:left;min-height:48px}
.opt.on{border-color:var(--sea);background:var(--sea-2);font-weight:700}
.ox{display:grid;gap:10px}
.oxrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.oxbtns{display:flex;gap:6px}
.oxb{width:52px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-family:var(--f-display);font-size:22px}
.oxb.on{border-color:var(--sea);background:var(--sea);color:#fff}
.lockbox{display:grid;gap:16px}
.lfield{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.lfield .lab{min-width:0;flex:1 1 220px}
.wheels{display:flex;align-items:flex-end;gap:4px;background:var(--ink);padding:8px 10px;border-radius:10px}
.wheel{display:grid;justify-items:center;gap:2px}
.wheel button{width:44px;height:28px;border:none;border-radius:6px;background:#3a4750;color:#fff;font-size:13px}
.wheel .d{width:44px;height:52px;display:grid;place-items:center;background:var(--label);border-radius:6px;font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--ink)}
.wheels .pt{color:#fff;font-family:var(--f-num);font-size:32px;font-weight:700;padding-bottom:30px}
.unit{font-weight:700}
.lin{display:flex;align-items:center;gap:10px}
.lockbox.compact{display:flex;flex-wrap:wrap;gap:16px 26px}
.lockbox.compact .lab{flex:0 0 auto;font-size:24px;font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0;font-size:14px;color:var(--ink-2);font-weight:400}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-height:48px}
.tile .badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:700;background:var(--line);color:var(--ink)}
.tile.pick{border-color:var(--amber);background:var(--amber-2)}
.tile.paired{border-color:var(--sea)}
.tile.paired .badge{background:var(--sea);color:#fff}
.bucket{border:2px dashed var(--ink-2);border-radius:10px;padding:10px;display:grid;gap:8px;min-height:120px;align-content:start;background:rgba(255,255,255,.7);text-align:left}
.bucket .bh{font-family:var(--f-display);font-size:19px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .tile{flex:0 1 auto}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-num);font-size:30px;font-weight:700}
.slot{width:54px;height:66px;border:2px dashed var(--ink-2);border-radius:8px;background:#fff;display:grid;place-items:center;font-family:var(--f-num);font-size:30px;font-weight:700}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--amber-2)}
.bigcard{width:54px;height:66px;border:2px solid var(--ink);border-radius:8px;background:var(--amber-2);font-family:var(--f-num);font-size:30px;font-weight:700}
.bigcard.used{opacity:.25}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fb{padding:10px 14px;border-radius:8px;font-weight:700}
.fb.bad{background:var(--berry-2);color:var(--berry)}
.fb.info{background:var(--amber-2);color:#8a5410}
.fb.good{background:var(--leaf-2);color:var(--leaf)}
.hints{display:grid;gap:8px}
.hint{background:var(--amber-2);border-radius:8px;padding:10px 14px;font-size:15px}
.solved{border:2px solid var(--leaf);background:var(--leaf-2);border-radius:10px;padding:18px;display:grid;gap:10px}
.solved h3{color:var(--leaf);font-size:26px}
.solved p{margin:0}

/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(28,42,51,.72);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--label);border:2px solid var(--ink);border-radius:12px;max-width:520px;width:100%;padding:24px;display:grid;gap:14px;text-align:center;justify-items:center}
.sheet h2{font-size:30px}
.sheet .bigcard{width:80px;height:100px;font-size:48px;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

/* 결과 */
.result{display:grid;gap:20px;padding-top:20px}
.scoreline{display:flex;flex-wrap:wrap;gap:14px}
.stat{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:12px 18px;display:grid;min-width:130px}
.stat b{font-family:var(--f-num);font-size:30px}
.stat span{font-size:13px;color:var(--ink-2)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.qcell{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;display:grid;gap:2px}
.qcell.first{border-color:var(--leaf)}
.qcell.later{border-color:var(--amber)}
.qcell .mk{font-family:var(--f-num);font-weight:700}

/* 교사 화면 */
.teacher{display:grid;gap:16px;padding-top:20px}
.tablewrap{overflow-x:auto;background:#fff;border:1.5px solid var(--ink);border-radius:10px}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--sea-2);font-weight:700;position:sticky;top:0}
td.name{text-align:left}
td.o{color:var(--leaf);font-weight:700}
td.t{color:var(--amber);font-weight:700}
td.x{color:var(--line)}
tr.rate td{background:var(--paper);font-weight:700}
.legend{font-size:14px;color:var(--ink-2)}

/* 엘리베이터 시작 화면 */
.start-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:center;max-width:900px}
@media (max-width:720px){.start-grid{grid-template-columns:minmax(0,1fr)}}
.start-copy{display:grid;gap:16px}
.lead{margin:0;font-size:18px;max-width:34em}
.elev{justify-self:center;width:100%;max-width:330px;background:linear-gradient(160deg,#e1e6ea,#a9b3bc 48%,#d3d9de);border:3px solid #5c6670;border-radius:20px;padding:18px;display:grid;gap:14px;justify-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 10px 0 #4b545c,0 22px 34px rgba(0,0,0,.25)}
.elev-screen{width:100%;background:#140b06;border-radius:10px;border:3px solid #39404a;padding:10px 16px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 12px;color:#ff9f1c;text-shadow:0 0 10px rgba(255,159,28,.85),0 0 2px #ffcf7a;box-shadow:inset 0 0 18px rgba(0,0,0,.8)}
.elev-screen b{font-size:46px;line-height:1.1;letter-spacing:.06em}
.elev-arrow{font-size:22px;animation:blink 1.2s steps(2) infinite}
.elev-place{grid-column:1/-1;font-size:14px;font-family:var(--f-body)}
@keyframes blink{50%{opacity:.25}}
.elev-btns{display:grid;gap:12px;width:100%}
.ebtn{display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(#f7f9fa,#cfd6dc);border:2px solid #5c6670;border-radius:999px;padding:7px 16px 7px 7px;box-shadow:0 4px 0 #5c6670;color:#26303a;min-width:0}
.ebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5c6670}
.ebtn .ecode{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffffff,#d8dee3 60%,#9aa6b0);border:3px solid #6b757e;font-weight:700;font-size:18px;color:#26303a}
.ebtn .efloor{display:grid;font-family:var(--f-display);font-size:22px;line-height:1.15;min-width:0}
.ebtn .efloor small{font-family:var(--f-body);font-size:13px;color:#56616b}
.ebtn.on{background:linear-gradient(#fffaf0,#ffe8b0);border-color:#b36b00}
.ebtn.on .ecode{background:radial-gradient(circle at 35% 30%,#fff7d1,#ffcf56 55%,#e08a12);border-color:#b36b00;color:#5a3300;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(255,207,86,.45),0 0 18px rgba(255,180,40,.8)}50%{box-shadow:0 0 0 8px rgba(255,207,86,.2),0 0 32px rgba(255,180,40,1)}}
.elev-plate{font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:#3d464e;background:#eef1f3;border:1px solid #7a848d;border-radius:4px;padding:2px 10px}
.floorinfo{display:grid;gap:6px}
.floorinfo b{font-family:var(--f-display);font-weight:400;font-size:26px}
.floorinfo p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--sea-2);color:var(--sea)}
.elev-doors{position:fixed;inset:0;z-index:60;pointer-events:none}
.elev-doors .ed{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#aeb7bf 0 3px,#c9d0d6 3px 34px);box-shadow:inset 0 0 0 4px #6b757e;animation:edl 1.6s cubic-bezier(.7,0,.3,1) forwards}
.elev-doors .ed.l{left:0}.elev-doors .ed.r{right:0;animation-name:edr}
@keyframes edl{0%,45%{transform:translateX(0)}100%{transform:translateX(-102%)}}
@keyframes edr{0%,45%{transform:translateX(0)}100%{transform:translateX(102%)}}
.ed-sign{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#140b06;color:#ff9f1c;border:3px solid #39404a;border-radius:12px;padding:12px 28px;display:grid;justify-items:center;font-family:var(--f-num);text-shadow:0 0 10px rgba(255,159,28,.85);animation:sign 1.6s forwards}
.ed-sign b{font-size:52px;line-height:1.1}
.ed-sign span{font-family:var(--f-body);font-size:16px}
@keyframes sign{0%,38%{opacity:1}52%,100%{opacity:0}}
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:70}
/* 게임 화면 효과 */
.floorbadge{background:var(--ink);color:#ffd23f;font-weight:700;border-radius:6px;padding:3px 9px;font-size:13px;align-self:center}
.mute{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:13px;white-space:nowrap}
.panel.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.panel.pass{animation:passp .7s}
@keyframes passp{0%{box-shadow:0 0 0 0 rgba(47,132,72,.65)}100%{box-shadow:0 0 0 22px rgba(47,132,72,0)}}
.solved{animation:popIn .55s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 0 6px rgba(47,132,72,.15),0 12px 30px rgba(47,132,72,.25)}
@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.sheet{animation:popIn .5s cubic-bezier(.2,1.5,.4,1)}
.sheet .bigcard{animation:flip .9s cubic-bezier(.2,1.3,.4,1);box-shadow:0 0 0 4px #fff,0 0 34px rgba(255,200,60,.95)}
@keyframes flip{0%{transform:rotateY(540deg) scale(.3)}100%{transform:none}}
.wheel .d.roll-up{animation:rollup .18s ease-out}
.wheel .d.roll-down{animation:rolldown .18s ease-out}
@keyframes rollup{0%{transform:translateY(40%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes rolldown{0%{transform:translateY(-40%);opacity:.2}100%{transform:none;opacity:1}}
.crate,.ncard{transition:transform .2s}
@media (prefers-reduced-motion:reduce){.panel.shake,.panel.pass,.solved,.sheet,.sheet .bigcard,.ebtn.on .ecode,.elev-arrow,.wheel .d{animation:none!important}}

/* 출제마법사에서 가져온 것: 난이도, 보기 번호, 그림, 서술형, QR */
.diff{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:17px;margin-right:10px;vertical-align:middle;color:#fff;font-family:var(--f-display)}
.d-lo{background:#5fb38a}.d-mid{background:#5aa7da}.d-hi{background:#c27ad6}
.dtag{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;padding:0 6px;font-size:12px;color:#fff;font-weight:700}
.dchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
.opt.check{display:flex;align-items:center;gap:8px}
.cbox{flex:none;width:22px;height:22px;border:2px solid var(--ink-2);border-radius:5px;display:grid;place-items:center;font-weight:700;background:#fff;color:var(--sea)}
.opt.on .cbox{border-color:var(--sea)}
.wtext{font:inherit;font-size:16px;width:100%;min-height:84px;padding:10px 12px;border:1.5px solid var(--ink-2);border-radius:8px;resize:vertical;background:#fffdf7;color:var(--ink)}
.fig{margin:0;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;max-width:600px;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-weight:700;color:var(--amber);margin-bottom:6px}
.fig pre{font-family:var(--f-num);font-size:18px;margin:0;line-height:1.5;overflow-x:auto}
.divt{display:grid;grid-template-columns:auto auto;gap:6px;align-items:center;justify-content:start}
.divt .arr{font-family:var(--f-num);font-weight:700;color:#5a6ab0;text-align:center}
.divt .arr.v{line-height:1.2}
.divt table{border-collapse:collapse}
.divt td{width:76px;height:50px;text-align:center;border:2px solid #8f9fc0;background:#eef1fb;font-family:var(--f-num);font-size:20px;font-weight:700}
.divt td.blank{background:#fff;color:#7a86a8;font-family:var(--f-body)}
.divt td.none{border:none;background:transparent}
.qrbox{background:#fff;padding:12px;border-radius:10px;border:1.5px solid var(--line);min-width:240px;min-height:240px;display:grid;place-items:center}
.wlist{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px}
.wlist h3{font-size:18px;margin-bottom:6px}
.wlist ul{margin:0;padding-left:18px;display:grid;gap:6px}
.wlist .who{color:var(--ink-2);font-size:14px}
.wlist .o{color:var(--leaf);font-weight:700}.wlist .t{color:var(--amber);font-weight:700}

/* ===================================================================
   저장소 (브라우저 / 결과 전송)
=================================================================== */
const LS_RUN = 'escape:' + UNIT.id + ':run';
const LS_DEMO = 'escape:' + UNIT.id + ':demo-results';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

const Backend = (() => {
  const gas = (typeof google !== 'undefined' && google.script && google.script.run) ? google.script.run : null;
  const mode = gas ? 'gas' : (CONFIG.ENDPOINT ? 'url' : 'demo');
  function gasCall(fn, arg) {
    return new Promise((res, rej) => gas.withSuccessHandler(res).withFailureHandler(rej)[fn](arg));
  }
  function save(rec) {
    if (mode === 'gas') return gasCall('saveResult', rec);
    if (mode === 'url') return fetch(CONFIG.ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rec) });
    const all = lsGet(LS_DEMO, {}); all[rec.runId] = Object.assign({}, rec, { savedAt: new Date().toISOString() }); lsSet(LS_DEMO, all);
    return Promise.resolve();
  }
  function load(key) {
    if (mode === 'gas') return gasCall('getResults', key);
    if (mode === 'url') return fetch(CONFIG.ENDPOINT + '?action=results&key=' + encodeURIComponent(key)).then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); return d.rows; });
    return Promise.resolve(Object.values(lsGet(LS_DEMO, {})));
  }
  return { mode, save, load };
})();

}

function res(pid) { return S.results[pid] || (S.results[pid] = { a: 0, h: 0, s: false, f: null }); }

function record() {
  const detail = {}; P.forEach(p => { const r = S.results[p.id]; if (r) detail[p.id] = r; });
  const solved = P.filter(p => S.results[p.id] && S.results[p.id].s).length;

    seconds: Math.round(elapsed() / 1000), done: !!S.finishedAt, startedAt: new Date(S.startedAt).toISOString(), detail };
}

/* ===================================================================
   문제 조작 상태 / 채점
=================================================================== */
function curPart() { const p = P[S.current]; return p.parts[S.part]; }
function initWork(part) {
  switch (part.type) {
    case 'choice': return { sel: {} };
    case 'multi': return { sel: [] };
    case 'write': return { vals: part.fields.map(f => f.format.split('').filter(c => c === '#').map(() => 0)), text: '' };
    case 'ox': return { sel: {} };
    case 'lock': return { vals: part.fields.map(f => f.format.split('').filter(c => c === '#').map(() => 0)) };
    case 'match': return { pairs: {}, pick: null };
    case 'sort': return { place: {}, pick: null };
    case 'order': return { seq: [] };
    case 'build': return { slots: {}, pickCard: null };
  }
}
function fieldText(f, digits) { let i = 0; return f.format.split('').map(c => c === '#' ? digits[i++] : c).join(''); }
function exprValue(slots) { return parseFloat(slots.a + '.' + slots.b) / parseFloat(slots.c + '.' + slots.d); }
function bestBuild(cards) {
  let best = -1;
  const n = cards.length;
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) for (let c = 0; c < n; c++) for (let d = 0; d < n; d++) {
    if (new Set([a, b, c, d]).size < 4) continue;
    if (cards[c] === '0' && cards[d] === '0') continue;
    const v = exprValue({ a: cards[a], b: cards[b], c: cards[c], d: cards[d] });
    if (isFinite(v) && v > best) best = v;
  }
  return best;
}
function check(part, w) {
  switch (part.type) {
    case 'multi': {
      const set = new Set(w.sel), ans = new Set(part.answer);
      if (!set.size) return { ok: false, incomplete: true, correct: 0, total: 1 };
      const ok = set.size === ans.size && [...ans].every(i => set.has(i));
      return { ok, correct: ok ? 1 : 0, total: 1, single: true };
    }
    case 'write': {
      if ((w.text || '').trim().length < 5) return { ok: false, incomplete: true, needText: true, correct: 0, total: 1 };
      const t = part.fields.length, c = part.fields.filter((f, i) => fieldText(f, w.vals[i]) === f.answer).length;
      return { ok: c === t, correct: c, total: t, single: t === 1 };
    }
    case 'choice': {
      const t = part.questions.length, done = Object.keys(w.sel).length;
      const c = part.questions.filter((q, i) => w.sel[i] === q.answer).length;
      return { ok: c === t, correct: c, total: t, incomplete: done < t };
    }
    case 'ox': {
      const t = part.statements.length, done = Object.keys(w.sel).length;
      const c = part.statements.filter((s, i) => w.sel[i] === s.answer).length;
      return { ok: c === t, correct: c, total: t, incomplete: done < t };
    }
    case 'lock': {
      const t = part.fields.length;
      const c = part.fields.filter((f, i) => fieldText(f, w.vals[i]) === f.answer).length;
      return { ok: c === t, correct: c, total: t, single: t === 1 };
    }
    case 'match': {
      const keys = Object.keys(part.answer), t = keys.length;
      const c = keys.filter(k => w.pairs[k] === part.answer[k]).length;
      return { ok: c === t, correct: c, total: t, incomplete: Object.keys(w.pairs).length < t };
    }
    case 'sort': {
      const keys = Object.keys(part.answer), t = keys.length;
      const c = keys.filter(k => w.place[k] === part.answer[k]).length;
      return { ok: c === t, correct: c, total: t, incomplete: Object.keys(w.place).length < t };
    }
    case 'order': {
      const t = part.answer.length;
      const c = part.answer.filter((id, i) => w.seq[i] === id).length;
      return { ok: c === t, correct: c, total: t, incomplete: w.seq.length < t };
    }
    case 'build': {
      const keys = part.template.filter(k => k.length === 1 && /[a-z]/.test(k));
      const filled = keys.every(k => w.slots[k] != null);
      if (!filled) return { ok: false, incomplete: true, correct: 0, total: 1 };
      const sl = {}; keys.forEach(k => sl[k] = S.cards[w.slots[k]]);
      const v = exprValue(sl);
      return { ok: Math.abs(v - bestBuild(S.cards)) < 1e-9, correct: 0, total: 1, build: true };
    }
  }
}

    return `<figure class="fig"><svg viewBox="0 0 470 138" role="img" aria-label="길이 ${esc(f.len)}인 색 테이프를 ${esc(f.overlap)}씩 겹쳐 이어 붙인 그림">
      ${xs.map((x, i) => `<rect x="${x}" y="46" width="${i === 2 ? 150 : W2}" height="38" fill="${i % 2 ? '#f8d2a9' : '#fbe1c4'}" stroke="#a5713f" stroke-width="2.5"/>`).join('')}
      ${xs.slice(1).map(x => `<rect x="${x}" y="46" width="${OV}" height="38" fill="#e09a5c" opacity=".8"/><line x1="${x + OV / 2}" y1="88" x2="${x + OV / 2}" y2="106" stroke="#a5713f" stroke-width="2" stroke-dasharray="4 3"/><text x="${x + OV / 2}" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#7a4d22">${esc(f.overlap)}</text>`).join('')}
      ${xs.slice(0, 2).map((x, i) => `<path d="M${x} ${40 - i * 0} q${W2 / 2} -18 ${W2} 0" fill="none" stroke="#7a8590" stroke-width="2" stroke-dasharray="5 4"/><text x="${x + W2 / 2}" y="${i ? 22 : 22}" text-anchor="middle" font-size="21" font-weight="700" fill="#3d4750" dx="${i ? 12 : -12}">${esc(f.len)}</text>`).join('')}
      <text x="440" y="74" font-size="28" fill="#7a8590">…</text></svg></figure>`;
  }
  if (f.kind === 'divtable') {
    return `<figure class="fig"><div class="divt"><span></span><span class="arr">÷ →</span><span class="arr v">÷<br>↓</span>
      <table>${f.cells.map(row => `<tr>${row.map(c => `<td class="${!c ? 'none' : /^[㉠-㉣]$/.test(c) ? 'blank' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></figure>`;
  }
  if (f.kind === 'work') return `<figure class="fig"><figcaption>${esc(f.title)}</figcaption><pre>${f.lines.map(esc).join('\n')}</pre></figure>`;
  return '';
}

function renderPart(part, w) {
  switch (part.type) {
    case 'multi': return `<div class="q"><div class="qt">${esc(part.q)}</div>
      <div class="opts">${part.options.map((o, oi) => { const on = w.sel.includes(oi); return `<button class="opt check ${on ? 'on' : ''}" data-act="multi" data-o="${oi}" aria-pressed="${on}"><span class="cbox">${on ? '✓' : ''}</span>${CIRC[oi]} ${esc(o)}</button>`; }).join('')}</div>
      <p class="muted" style="margin:0;font-size:14px">답이 여러 개일 수 있어요. 해당하는 것을 모두 누르세요.</p></div>`;
    case 'write': return `<div class="q"><label class="qt" for="w-text">${esc(part.prompt)}</label>
      <textarea id="w-text" class="wtext" rows="3" placeholder="${esc(part.placeholder || '')}">${esc(w.text || '')}</textarea>
      <p class="muted" style="margin:0;font-size:13px">쓴 내용은 선생님께 그대로 전달돼요.</p></div>` + renderPart({ type: 'lock', fields: part.fields }, w);
    case 'choice': return part.questions.map((q, qi) => `<div class="q"><div class="qt">${part.questions.length > 1 ? `(${qi + 1}) ` : ''}${esc(q.q)}</div>
      <div class="opts">${q.options.map((o, oi) => `<button class="opt ${w.sel[qi] === oi ? 'on' : ''}" data-act="choice" data-q="${qi}" data-o="${oi}">${CIRC[oi]} ${esc(o)}</button>`).join('')}</div></div>`).join('');
    case 'ox': return `<div class="ox">${part.statements.map((s, si) => `<div class="oxrow"><span>${si + 1}. ${esc(s.text)}</span>
      <span class="oxbtns"><button class="oxb ${w.sel[si] === true ? 'on' : ''}" data-act="ox" data-s="${si}" data-v="1" aria-label="O">O</button><button class="oxb ${w.sel[si] === false ? 'on' : ''}" data-act="ox" data-s="${si}" data-v="0" aria-label="X">X</button></span></div>`).join('')}</div>`;
    case 'lock': return `<div class="lockbox ${part.fields.every(f => f.label.length <= 2) ? 'compact' : ''}">${part.fields.map((f, fi) => {
      let di = 0;
      const wheels = f.format.split('').map(c => {
        if (c !== '#') return `<span class="pt">${esc(c)}</span>`;
        const d = di++;
        const rl = w.roll && w.roll.startsWith(fi + '-' + d + '-') ? (w.roll.endsWith('-1') && !w.roll.endsWith('--1') ? 'roll-up' : 'roll-down') : '';
        return `<span class="wheel"><button data-act="wheel" data-f="${fi}" data-d="${d}" data-dir="1" aria-label="올리기">▲</button><span class="d ${rl}">${w.vals[fi][d]}</span><button data-act="wheel" data-f="${fi}" data-d="${d}" data-dir="-1" aria-label="내리기">▼</button></span>`;
      }).join('');
      return `<div class="lfield"><span class="lab">${esc(f.label)}</span><span class="lin"><span class="wheels">${wheels}</span>${f.unit ? `<span class="unit">${esc(f.unit)}</span>` : ''}</span></div>`;
    }).join('')}</div>`;
    case 'match': {
      const used = Object.values(w.pairs);
      const nOf = id => Object.keys(part.answer).indexOf(id) + 1;
      return `<div class="two"><div class="col"><h4>식 · 기계</h4>${part.left.map(l => `<button class="tile ${w.pick === l.id ? 'pick' : ''} ${w.pairs[l.id] ? 'paired' : ''}" data-act="mL" data-id="${l.id}"><span class="badge">${nOf(l.id)}</span><span>${esc(l.label)}</span></button>`).join('')}</div>
        <div class="col"><h4>짝</h4>${part.right.map(rt => { const owner = Object.keys(w.pairs).find(k => w.pairs[k] === rt.id);
          return `<button class="tile ${owner ? 'paired' : ''}" data-act="mR" data-id="${rt.id}"><span class="badge">${owner ? nOf(owner) : ''}</span><span class="num">${esc(rt.label)}</span></button>`; }).join('')}</div></div>`;
    }
    case 'sort': {
      const free = part.items.filter(it => !w.place[it.id]);
      return `<div class="pool">${free.map(it => `<button class="tile ${w.pick === it.id ? 'pick' : ''}" data-act="sItem" data-id="${it.id}"><span class="num">${esc(it.label)}</span></button>`).join('') || '<span class="muted">모든 카드를 담았어요. 잘못 담은 카드는 눌러서 꺼낼 수 있어요.</span>'}</div>
        <div class="two">${part.buckets.map(b => `<div class="bucket" data-act="sBucket" data-id="${b.id}" role="button" tabindex="0"><span class="bh">${esc(b.label)}</span>
          ${part.items.filter(it => w.place[it.id] === b.id).map(it => `<button class="tile" data-act="sOut" data-id="${it.id}"><span class="num">${esc(it.label)}</span></button>`).join('')}</div>`).join('')}</div>`;
    }
    case 'order': return `<div class="col">${part.items.map(it => { const k = w.seq.indexOf(it.id);
      return `<button class="tile ${k >= 0 ? 'paired' : ''}" data-act="oItem" data-id="${it.id}"><span class="badge">${k >= 0 ? k + 1 : ''}</span><span class="num">${esc(it.label)}</span></button>`; }).join('')}</div>`;
    case 'build': {
      const usedIdx = Object.values(w.slots);
      return `<div class="expr">${part.template.map(k => /^[a-z]$/.test(k)
          ? `<button class="slot ${w.slots[k] != null ? 'full' : ''}" data-act="bSlot" data-k="${k}" aria-label="빈칸">${w.slots[k] != null ? esc(S.cards[w.slots[k]]) : ''}</button>`
          : `<span>${esc(k)}</span>`).join('')}</div>
        <div class="muted" style="font-size:15px">모은 숫자 카드 (누르면 빈칸에 들어가요. 칸을 누르면 빠져요)</div>
        <div class="row">${S.cards.map((c, i) => `<button class="bigcard ${usedIdx.includes(i) ? 'used' : ''}" data-act="bCard" data-i="${i}" ${usedIdx.includes(i) ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>`;
    }
  }
}

      <p style="margin:0">${esc(room.note.text)}</p><button class="btn primary" data-act="closeOverlay">노트 덮기</button></div></div>`;

      <button class="btn primary" data-act="toResult">내 결과 보기</button></div></div>`;

  return '';

function renderTeacher() {
  let body = '';
  if (!teacherData) {
    body = `<div class="dossier"><p>${Backend.mode === 'demo' ? '연습 모드예요. 이 기기에서 플레이한 기록만 보여요. 비밀번호 칸은 비워 두어도 돼요.' : 'Apps Script에 정한 선생님 비밀번호를 입력하세요.'}</p>
      <label class="form" style="grid-template-columns:1fr"><span class="muted" style="font-size:14px">선생님 비밀번호</span><input id="t-key" type="password" autocomplete="off" value="${esc(teacherKey)}"></label>
      <div class="err">${esc(teacherErr)}</div><div><button class="btn primary" data-act="tLoad">결과 불러오기</button></div></div>`;
  } else {
    setLevel(teacherLevel);
    const lvOf = r => r.level || 'basic';
    const firstRuns = {};
    teacherData.filter(r => lvOf(r) === teacherLevel).forEach(r => { const k = r.cls + '|' + r.num + '|' + r.name; (firstRuns[k] = firstRuns[k] || []).push(r); });
    let rows = Object.values(firstRuns).map(list => { list.sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt))); return Object.assign({}, list[0], { tries: list.length }); });
    const classes = [...new Set(rows.map(r => String(r.cls)))].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
    if (teacherCls) rows = rows.filter(r => String(r.cls) === teacherCls);
    rows.sort((a, b) => (Number(a.cls) - Number(b.cls)) || (Number(a.num) - Number(b.num)));
    const det = r => typeof r.detail === 'string' ? JSON.parse(r.detail || '{}') : (r.detail || {});
    const rate = P.map(p => { const att = rows.filter(r => det(r)[p.id] && det(r)[p.id].s); const ok = rows.filter(r => det(r)[p.id] && det(r)[p.id].f);
      return att.length ? Math.round(ok.length / att.length * 100) + '%' : '-'; });
    const counts = l => new Set(teacherData.filter(r => lvOf(r) === l.id).map(r => r.cls + '|' + r.num + '|' + r.name)).size;
    body = `<div class="levels" style="max-width:none" role="tablist">${UNIT.levels.map(l => `<button class="lvl ${l.id === teacherLevel ? 'on' : ''} lvl-${l.id}" data-act="tLevel" data-id="${l.id}" role="tab" aria-selected="${l.id === teacherLevel}"><span class="lvl-tag">${esc(l.code)}</span><b style="font-size:20px">${esc(l.floor)}</b><span>${esc(l.label)} 수준 · 학생 ${counts(l)}명</span></button>`).join('')}</div>
      <div class="row"><button class="btn primary" data-act="tLoad">새로고침</button>
        <label class="row" style="gap:6px">반 <select id="t-cls" style="font:inherit;padding:6px 10px;border-radius:8px">${['', ...classes].map(c => `<option value="${esc(c)}" ${c === teacherCls ? 'selected' : ''}>${c ? esc(c) + '반' : '전체'}</option>`).join('')}</select></label>
        <button class="btn ghost" data-act="tCopy">표 복사 (스프레드시트에 붙여넣기)</button>
        <span class="muted" style="font-size:14px">학생 ${rows.length}명 · 완료 ${rows.filter(r => r.done === true || r.done === 'TRUE' || r.done === 'true').length}명</span></div>
      <p class="legend">○ 한 번에 맞힘 · △ 다시 풀어서 맞힘 · 숫자는 사용한 힌트 · 점수는 한 번에 맞힌 문항 수 · 학생이 처음부터 다시 하면 첫 번째 기록만 보여요</p>
      <div class="tablewrap"><table><thead><tr><th>반</th><th>번호</th><th>이름</th><th>점수</th><th>진행</th><th>힌트</th><th>시간</th>${P.map((p, i) => `<th title="${esc(p.title)}">${i + 1}<br><span class="dtag d-${DIFF_CLASS[p.diff] || 'mid'}">${esc(p.diff || '')}</span></th>`).join('')}<th>재시작</th></tr></thead><tbody>
      ${rows.map(r => { const d = det(r); return `<tr><td>${esc(r.cls)}</td><td>${esc(r.num)}</td><td class="name">${esc(r.name)}</td><td class="num"><b>${esc(r.score)}</b></td><td class="num">${esc(r.progress)}/${P.length}</td><td class="num">${esc(r.hints)}</td><td class="num">${fmtTime((Number(r.seconds) || 0) * 1000)}</td>
        ${P.map(p => { const x = d[p.id]; if (!x || !x.s) return '<td class="x">·</td>'; return `<td class="${x.f ? 'o' : 't'}">${x.f ? '○' : '△'}${x.h ? '<sup>' + x.h + '</sup>' : ''}</td>`; }).join('')}<td class="num">${r.tries > 1 ? r.tries - 1 + '회' : ''}</td></tr>`; }).join('')}
      <tr class="rate"><td colspan="7">문항별 첫 시도 정답률</td>${rate.map(x => `<td class="num">${x}</td>`).join('')}<td></td></tr>
      </tbody></table></div>
      <div class="row">${['하', '중', '상'].map(dv => { const ps = P.filter(p => p.diff === dv); if (!ps.length) return '';
        let att = 0, ok = 0; rows.forEach(r => { const d = det(r); ps.forEach(p => { if (d[p.id] && d[p.id].s) { att++; if (d[p.id].f) ok++; } }); });
        return `<span class="dchip"><span class="dtag d-${DIFF_CLASS[dv]}">${dv}</span> ${ps.length}문항 · 첫 시도 정답률 <b class="num">${att ? Math.round(ok / att * 100) + '%' : '-'}</b></span>`; }).join('')}</div>
      ${P.filter(p => p.parts.some(x => x.type === 'write')).map(p => { const list = rows.filter(r => det(r)[p.id] && det(r)[p.id].text);
        return `<div class="wlist"><h3>서술형 · ${P.indexOf(p) + 1}. ${esc(p.title)}</h3>${list.length ? `<ul>${list.map(r => { const x = det(r)[p.id]; return `<li><span class="who">${esc(r.num)}번 ${esc(r.name)}</span> <span class="${x.f ? 'o' : x.s ? 't' : 'muted'}">${x.f ? '○' : x.s ? '△' : '풀이 중'}</span> ${esc(x.text)}</li>`; }).join('')}</ul>` : '<p class="muted">아직 쓴 학생이 없어요.</p>'}</div>`; }).join('')}`;
  }
  return `<section class="teacher"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${esc(UNIT.unitName)}</div><h2 style="font-size:34px">선생님 결과판</h2></div><div class="row"><button class="btn ghost" data-act="qr">QR 크게 보기</button><button class="btn ghost" data-act="home">처음 화면</button></div></div>${body}</section>`;
}

/* ===================================================================
   동작
=================================================================== */
function startTimer() { clearInterval(window.__t); window.__t = setInterval(() => { const t = document.getElementById('timer'); if (t && S) t.textContent = fmtTime(elapsed()); }, 1000); }
function pause() { if (S && S.runningSince) { S.elapsedMs += Date.now() - S.runningSince; S.runningSince = null; persist(); } }
function resume() { if (S && !S.runningSince && !S.finishedAt) { S.runningSince = Date.now(); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else { resume(); } });

function openPuzzle() { savePos(); G.player = null; G.keys = []; G.path = []; work = initWork(curPart()); fb = null; view = 'puzzle'; render(); window.scrollTo(0, 0); }

function submit() {
  const p = P[S.current], r = res(p.id), part = curPart();
  if (part.type === 'write') { r.text = (work.text || '').trim(); persist(); }
  const c = check(part, work);
  if (c.incomplete) { fb = { tone: 'info', text: c.needText ? '이유(과정)를 한 문장 이상 써 주세요.' : '아직 다 채우지 않았어요. 빈 곳을 채워 보세요.' }; render(); return; }
  if (c.ok) {
    if (S.part < p.parts.length - 1) { S.part++; work = initWork(curPart()); fb = { tone: 'good', text: (S.part) + '단계 통과! 다음 단계로 가요.' }; SFX.play('step'); persist(); render(); return; }
    r.a++; r.s = true; if (r.f === null) r.f = (r.a === 1);
    if (p.card && !S.cards.includes(p.card)) S.cards.push(p.card);
    S.solvedView = true; fb = null; SFX.play('correct'); if (!p.final) FX.burstPid = p.id; celebrate('small'); persist(); sync(); render(); window.scrollTo(0, 0); return;
  }
  r.a++; if (r.f === null) r.f = false;
  SFX.play('wrong');
  persist();
  fb = c.build ? { tone: 'bad', text: '문이 꿈쩍도 하지 않아요. 몫이 더 큰 식을 만들 수 있어요.' }
    : part.type === 'multi' ? { tone: 'bad', text: '아직 열리지 않아요. 빠진 것이나 잘못 고른 것이 있어요.' }
    : c.single ? { tone: 'bad', text: '아직 열리지 않아요. 다시 계산해 보세요.' }
    : { tone: 'bad', text: `아직 열리지 않아요. ${c.total}개 중 ${c.correct}개가 맞았어요.` };
  render();
}

function next() {
  const p = P[S.current];
  S.solvedView = false; S.part = 0;
  if (p.final) { S.current = P.length; pause(); S.finishedAt = Date.now(); persist(); sync(); overlay = { kind: 'final' }; view = 'result'; render(); SFX.play('win'); celebrate('final'); return; }
  const prevRoom = p.room; S.current++;
  persist();
  if (p.card) { overlay = { kind: 'card', card: p.card, door: roomOf(S.current) !== prevRoom }; showNote = false; view = 'room'; render(); SFX.play('card'); celebrate('card'); return; }
  view = 'room'; render(); window.scrollTo(0, 0);
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const part = (S && view === 'puzzle' && S.current < P.length) ? curPart() : null;

/* ---------- 효과음 (WebAudio, 파일 없이) ---------- */

    door: () => { tone(260, 0, 0.45, 'triangle', 0.07, 2.4); tone(520, 0.2, 0.3, 'sine', 0.05); },

/* ---------- 지도 / 이동 ---------- */
function theme(r) { return THEMES[L.themes[r == null ? S.viewRoom : r]]; }
function tileAt(r, x, y) { if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return '#'; return L.maps[r][y][x]; }
function walkable(r, x, y) { return !SOLID.has(tileAt(r, x, y)); }
function findChar(r, ch) { for (let y = 0; y < ROWS; y++) { const x = L.maps[r][y].indexOf(ch); if (x >= 0) return { x, y }; } return { x: 1, y: 1 }; }
function roomCleared(r) { return roomPuzzles(r).every(x => S.results[x.p.id] && S.results[x.p.id].s); }
function slotOf(ch) { return roomPuzzles(S.viewRoom)['ABC'.indexOf(ch)]; }
function ensurePlayer() {
  if (!(S.viewRoom >= 0 && S.viewRoom < L.rooms.length)) S.viewRoom = Math.min(roomOf(S.current), L.rooms.length - 1);
  const r = S.viewRoom;
  if (!S.pos || S.pos.r !== r) { const st = findChar(r, 'S'); S.pos = { r, x: st.x, y: st.y, dir: 'up' }; }
  G.player = { x: S.pos.x, y: S.pos.y, fx: S.pos.x, fy: S.pos.y, tx: S.pos.x, ty: S.pos.y, dir: S.pos.dir, moving: false, prog: 0, step: 0 };
  const key = L.id + ':' + r;
  if (FX.roomKey !== key) { FX.roomKey = key; FX.enterAt = performance.now(); FX.parts = []; FX.floats = []; }
}
function savePos() { if (G.player && S) { S.pos = { r: S.viewRoom, x: G.player.x, y: G.player.y, dir: G.player.dir }; persist(); } }
function setStatus(text, toast) {
  const el = document.getElementById('status'); if (!el) return;
  if (toast) G.toastUntil = performance.now() + 2600;
  if (el.textContent !== text) el.textContent = text;
  el.classList.toggle('toast', !!toast);
}
function describe(ch) {
  if (ch === 'N') return '책상 위 관찰 노트예요. 부딪히거나 [조사]를 누르면 펼쳐져요.';
  if (ch === 'D') return roomCleared(S.viewRoom) ? '열린 문이에요. 위로 걸어가면 다음 방으로 가요!' : '잠긴 문이에요. 이 방의 상자를 모두 열어야 해요.';
  const it = slotOf(ch); if (!it) return '';
  const r = S.results[it.p.id];
  const name = it.p.final ? '출구 문' : '상자 ' + ('ABC'.indexOf(ch) + 1);
  if (r && r.s) return `${name} 「${it.p.title}」 · 이미 열었어요.`;
  if (it.i === S.current) return `${name} 「${it.p.title}」 · 부딪히거나 [조사]를 누르면 자물쇠 문제가 열려요.`;
  return `${name} · 앞 상자를 먼저 열어야 해요.`;
}
function interact(ch) {
  if (ch === 'N') { savePos(); G.keys = []; SFX.play('note'); overlay = { kind: 'note' }; render(); return; }
  if (ch === 'D') {
    if (!roomCleared(S.viewRoom)) { SFX.play('bump'); setStatus('문이 잠겨 있어요. 이 방의 상자 세 개를 모두 열어야 해요.', true); return; }
    SFX.play('door'); S.viewRoom++; S.pos = null; G.player = null; G.keys = []; G.path = []; persist(); render(); window.scrollTo(0, 0); return;
  }
  const it = slotOf(ch); if (!it) return;
  const r = S.results[it.p.id];
  if (r && r.s) { setStatus(`이미 연 ${it.p.final ? '문' : '상자'}예요 · 「${it.p.title}」`, true); return; }
  if (it.i === S.current) { SFX.play('open'); openPuzzle(); return; }
  SFX.play('bump'); setStatus('이 상자는 아직 잠겨 있어요. 앞 상자를 먼저 열어 보세요.', true);
}
function facing() { const p = G.player; const [dx, dy] = DIRS[p.dir]; return { x: p.x + dx, y: p.y + dy, ch: tileAt(S.viewRoom, p.x + dx, p.y + dy) }; }
function interactFacing() {
  if (!G.player || G.player.moving) return;
  const f = facing();
  if (INTERACT.has(f.ch)) interact(f.ch); else setStatus('앞에 살펴볼 물건이 없어요. 상자나 책상, 문 앞에 서서 눌러 보세요.', true);
}

/* 화면을 누른 곳까지 걸어가기 (너비 우선 탐색) */
function walkTo(tx, ty) {
  const r = S.viewRoom, p = G.player; if (!p) return;
  const sx = p.moving ? p.tx : p.x, sy = p.moving ? p.ty : p.y;
  const target = tileAt(r, tx, ty), goalObj = INTERACT.has(target);
  if (!goalObj && !walkable(r, tx, ty)) return;
  const prev = {}, key = (x, y) => x + ',' + y, q = [[sx, sy]]; prev[key(sx, sy)] = null;
  while (q.length) {
    const [x, y] = q.shift();
    for (const d in DIRS) { const nx = x + DIRS[d][0], ny = y + DIRS[d][1], k = key(nx, ny);
      if (k in prev || !walkable(r, nx, ny)) continue; prev[k] = [x, y, d]; q.push([nx, ny]); }
  }
  let end = null, last = null;
  if (goalObj) {
    let best = Infinity;
    for (const d in DIRS) { const nx = tx - DIRS[d][0], ny = ty - DIRS[d][1];
      if (!(key(nx, ny) in prev)) continue;
      let len = 0, c = [nx, ny]; while (prev[key(c[0], c[1])]) { c = prev[key(c[0], c[1])]; len++; }
      if (len < best) { best = len; end = [nx, ny]; last = d; } }
  } else if (key(tx, ty) in prev) end = [tx, ty];
  if (!end) { setStatus('그곳으로는 갈 수 없어요.', true); return; }
  const dirs = []; let c = end;
  while (prev[key(c[0], c[1])]) { const pr = prev[key(c[0], c[1])]; dirs.unshift(pr[2]); c = [pr[0], pr[1]]; }
  if (last) dirs.push(last);
  G.path = dirs; G.bumpKey = '';
  spawn({ type: 'ring', x: tx * T + 16, y: ty * T + 16, max: 0.45, color: '255,255,255', size: 18 });
}

function update(dt) {
  const p = G.player; if (!p) return;
  if (performance.now() - FX.enterAt < 600) return;   // 입장 연출 동안 잠시 멈춤
  if (p.moving) {
    p.prog += dt / 0.15;
    if (p.prog >= 1) { p.x = p.tx; p.y = p.ty; p.moving = false; p.prog = 0; G.bumpKey = ''; S.pos = { r: S.viewRoom, x: p.x, y: p.y, dir: p.dir }; }
  }
  if (!p.moving) {
    let dir = null, fromPath = false;
    if (G.keys.length) { dir = G.keys[G.keys.length - 1]; G.path = []; }
    else if (G.path.length) { dir = G.path.shift(); fromPath = true; }
    if (dir) {
      p.dir = dir;
      const nx = p.x + DIRS[dir][0], ny = p.y + DIRS[dir][1], ch = tileAt(S.viewRoom, nx, ny);
      if (walkable(S.viewRoom, nx, ny)) {
        p.moving = true; p.tx = nx; p.ty = ny; p.prog = 0; p.step++;
        for (let i = 0; i < 2; i++) spawn({ type: 'puff', x: p.x * T + 10 + i * 12, y: p.y * T + 30, max: 0.35, size: 3 + Math.random() * 2, color: theme().floor === 'ice' ? '255,255,255' : '120,110,95' });
      }
      else if (INTERACT.has(ch)) { const k = nx + ',' + ny; if (G.bumpKey !== k) { G.bumpKey = k; G.path = []; interact(ch); return; } }
      else if (fromPath) G.path = [];
    }
  }
  p.fx = p.moving ? p.x + (p.tx - p.x) * p.prog : p.x;
  p.fy = p.moving ? p.y + (p.ty - p.y) * p.prog : p.y;
  if (performance.now() > G.toastUntil) {
    const f = facing();
    setStatus(INTERACT.has(f.ch) ? describe(f.ch) : (roomCleared(S.viewRoom) && S.viewRoom < L.rooms.length - 1 ? '이 방의 상자를 모두 열었어요! 위쪽 문으로 걸어가세요.' : '방향키로 움직여 보세요. 반짝이는 상자에 부딪히면 자물쇠 문제가 열려요.'), false);
  }
}

/* ---------- 파티클 ---------- */
function spawn(o) { if (FX.parts.length < 420) FX.parts.push(Object.assign({ life: 0, max: 1, vx: 0, vy: 0, g: 0, size: 2, color: '255,255,255' }, o)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function burstAt(x, y, big) {

      R(x, y, 3, 2, 1, 4, '#888'); R(x, y, 2, 1, 3, 2, '#666'); R(x, y, 8, 3, 5, 2, '#e07a5f'); R(x, y, 9, 2, 3, 1, '#f2cc8f'); break;
    case 'i': R(x, y, 1, 3, 14, 12, '#bfe9f5'); R(x, y, 1, 3, 14, 3, '#ecfbff'); R(x, y, 12, 6, 3, 9, '#9fd6e8'); R(x, y, 3, 8, 2, 1, '#fff'); R(x, y, 4, 7, 1, 3, '#fff'); break;

}
function drawPlayer(p) {
  const bob = p.moving ? -Math.abs(Math.sin(p.prog * Math.PI)) * 2 : 0;
  const x = p.fx * T, y = p.fy * T + bob, u = 2;
  const P2 = (dx, dy, w, h, c) => { CX.fillStyle = c; CX.fillRect(x + dx * u, y + dy * u, w * u, h * u); };
  const walk = p.moving ? (p.step % 2 ? 1 : -1) * (p.prog < 0.5 ? 1 : 0) : 0;
  P2(5, 11, 2, 4 + (walk > 0 ? -1 : 0), '#2b3a55'); P2(9, 11, 2, 4 + (walk < 0 ? -1 : 0), '#2b3a55');
  P2(5, 14 + (walk > 0 ? -1 : 0), 2, 1, '#e76f51'); P2(9, 14 + (walk < 0 ? -1 : 0), 2, 1, '#e76f51');
  if (p.dir !== 'down') P2(p.dir === 'left' ? 9 : 4, 7, 3, 4, '#f4a261');   // 가방
  P2(4, 7, 8, 5, '#ffffff'); P2(4, 7, 8, 1, '#e8f1f0'); P2(7, 8, 2, 4, '#11686c'); P2(4, 11, 8, 1, '#d6e4e2');
  if (p.dir === 'up') P2(5, 7, 6, 4, '#f4a261');
  if (p.dir === 'left') P2(3, 8, 2, 3, '#f1c6a0'); else if (p.dir === 'right') P2(11, 8, 2, 3, '#f1c6a0'); else { P2(3, 8, 1, 3, '#f1c6a0'); P2(12, 8, 1, 3, '#f1c6a0'); }
  P2(4, 1, 8, 7, '#f6d0ad');
  P2(4, 0, 8, 3, '#3b2a20');
  if (p.dir === 'up') P2(4, 0, 8, 6, '#3b2a20');
  else if (p.dir === 'down') { P2(6, 4, 1, 2, '#1c2a33'); P2(9, 4, 1, 2, '#1c2a33'); P2(4, 3, 1, 2, '#3b2a20'); P2(11, 3, 1, 2, '#3b2a20'); P2(5, 6, 1, 1, '#f4a3a3'); P2(10, 6, 1, 1, '#f4a3a3'); }
  else if (p.dir === 'left') { P2(5, 4, 1, 2, '#1c2a33'); P2(9, 1, 3, 5, '#3b2a20'); }
  else { P2(10, 4, 1, 2, '#1c2a33'); P2(4, 1, 3, 5, '#3b2a20'); }

function currentTarget() {
  if (!S || S.current >= P.length) return null;
  const list = roomPuzzles(S.viewRoom), k = list.findIndex(x => x.i === S.current);
  return k >= 0 ? findChar(S.viewRoom, 'ABC'[k]) : null;
}
function doorOpenPos() { if (!S || !roomCleared(S.viewRoom) || S.viewRoom >= L.rooms.length - 1) return null; return findChar(S.viewRoom, 'D'); }
function label(ctx, text, cx, cy, bg, fg, size) {
  ctx.font = `700 ${size || 13}px "Gowun Dodum", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(text).width + 12, hgt = (size || 13) + 6;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(cx - w / 2 + 2, cy - hgt + 6, w, hgt);
  ctx.fillStyle = bg; ctx.fillRect(cx - w / 2, cy - hgt + 4, w, hgt); ctx.fillStyle = fg; ctx.fillText(text, cx, cy);
}
function mkLayer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
function draw(dt) {
  const cv = document.getElementById('scene'); if (!cv) return;
  if (!FX.layers) FX.layers = { floor: mkLayer(), obj: mkLayer(), sil: mkLayer(), light: mkLayer() };
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const r = S.viewRoom, p = G.player, prow = p ? Math.ceil(p.fy - 1e-6) : -1, tags = [];
  buildFloor();
  // 1) 바닥 + 물
  ctx.drawImage(FX.layers.floor, 0, 0);
  CX = ctx;
  for (const w of FX.water) drawWater(r, w.x, w.y, tileAt(r, w.x, w.y));
  // 2) 물건 층 (줄 단위로 겹침 순서 유지)
  const oc = FX.layers.obj.getContext('2d'); oc.clearRect(0, 0, W, H); CX = oc;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = tileAt(r, x, y);
      if (ch === '#' || ch === 'W') drawWall(r, x, y, ch);
      else if (ch === 'D') drawDoor(r, x, y, roomCleared(r), false);
      else if ('ABC'.includes(ch)) {
        const it = slotOf(ch); if (!it) continue;
        const res = S.results[it.p.id], st = res && res.s ? 'open' : it.i === S.current ? 'current' : 'locked';
        if (it.p.final) drawDoor(r, x, y, st === 'open', true); else drawCrate(x, y, st);
        tags.push({ x, y, k: 'ABC'.indexOf(ch) + 1, st, final: it.p.final });
      } else if (ch !== 'w' && ch !== 'l') drawThing(r, x, y, ch);

  sc.globalCompositeOperation = 'source-in'; sc.fillStyle = '#121826'; sc.fillRect(0, 0, W, H); sc.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.26; ctx.drawImage(FX.layers.sil, 5, 8); ctx.globalAlpha = 1;
  ctx.drawImage(FX.layers.sil, -2, 0); ctx.drawImage(FX.layers.sil, 2, 0); ctx.drawImage(FX.layers.sil, 0, -2); ctx.drawImage(FX.layers.sil, 0, 2);
  ctx.drawImage(FX.layers.obj, 0, 0);
  // 4) 파티클
  drawParticles(ctx);
  // 5) 조명
  const lights = [];
  if (p) lights.push({ x: p.fx * T + 16, y: p.fy * T + 14, r: L.dark > 0.4 ? 120 : 150, col: null });
  const cur = currentTarget(); if (cur) lights.push({ x: cur.x * T + 16, y: cur.y * T + 16, r: 92, col: '255,190,80', glow: 0.26 });
  const door = doorOpenPos(); if (door) lights.push({ x: door.x * T + 16, y: door.y * T + 30, r: 110, col: '120,255,160', glow: 0.24 });
  const note = findChar(r, 'N'); lights.push({ x: note.x * T + 26, y: note.y * T + 6, r: 54, col: '255,230,150', glow: 0.1 });
  for (let x = 0; x < COLS; x++) { const ch = tileAt(r, x, 0); if (ch === 'W') lights.push({ x: x * T + 16, y: 30, r: 80, col: '170,220,255', glow: 0.08 }); else if (ch === '#' && x % 5 === 2 && L.dark > 0) lights.push({ x: x * T + 16, y: 24, r: 58, col: '255,214,130', glow: 0.1 }); }
  const dark = L.dark ? L.dark + Math.sin(G.anim * 7) * 0.012 + (Math.random() < 0.004 ? 0.12 : 0) : 0;
  if (dark > 0) {
    const lc = FX.layers.light.getContext('2d');
    lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, W, H); lc.fillStyle = L.dark > 0.4 ? `rgba(3,5,16,${dark})` : `rgba(8,14,34,${dark})`; lc.fillRect(0, 0, W, H);
    lc.globalCompositeOperation = 'destination-out';
    for (const l of lights) { const g = lc.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.7, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); lc.fillStyle = g; lc.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2); }
    lc.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'lighter';
  for (const l of lights) { if (!l.col) continue; const pulse = l.glow * (1 + Math.sin(G.anim * 3) * 0.25); const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 0.8); g.addColorStop(0, `rgba(${l.col},${pulse})`); g.addColorStop(1, `rgba(${l.col},0)`); ctx.fillStyle = g; ctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2); }
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.68); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,20,.32)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // 6) 이름표, 번호표, 떠오르는 글자
  const bounce = Math.abs(Math.sin(G.anim * 3.2)) * 4;
  tags.forEach(t => {
    const bg = t.st === 'open' ? '#2f8448' : t.st === 'current' ? '#e08a12' : '#5d6873';
    if (t.final) label(ctx, t.st === 'open' ? '출구 열림' : '출구', t.x * T + 16, t.y * T + T + 16, bg, '#fff');
    else label(ctx, t.st === 'open' ? '✓' : String(t.k), t.x * T + 16, t.y * T - 2 - (t.st === 'current' ? bounce : 0), bg, '#fff');

    ctx.fillText(`${L.code} · ${L.floor} · 관찰실 ${r + 1} / ${L.rooms.length}`, W / 2, by + 24);
    ctx.fillStyle = '#ffffff'; ctx.font = '34px "Do Hyeon", sans-serif'; ctx.fillText(L.rooms[r].name, W / 2, by + 60);

function loop(ts) {
  requestAnimationFrame(loop);
  if (view !== 'room' || !S) { G.last = ts; return; }
  if (!G.player) ensurePlayer();
  const dt = Math.min(0.05, (ts - (G.last || ts)) / 1000); G.last = ts; G.anim += dt;
  if (FX.burstPid) {
    const list = roomPuzzles(S.viewRoom), k = list.findIndex(x => x.p.id === FX.burstPid);
    if (k >= 0) {

      floatText('열렸다!', c.x * T + 16, c.y * T - 6, '#2f8448');
      const d = doorOpenPos(); if (d && roomCleared(S.viewRoom)) { setTimeout(() => { spawn({ type: 'ring', x: d.x * T + 16, y: d.y * T + 20, max: 0.9, color: '120,255,160', size: 90 }); floatText('문이 열렸어요!', d.x * T + 16, d.y * T + 60, '#2f8448'); SFX.play('door'); }, 500); }
    }

}
requestAnimationFrame(loop);

/* ---------- 화면 전체 축하 효과 (DOM 위 캔버스) ---------- */
function celebrate(kind) {
  if (REDUCED) return;
  const c = document.createElement('canvas'); c.className = 'fx-layer'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'), parts = [], cols = ['#ffd166', '#ef476f', '#06d6a0', '#118ab2', '#f78c6b', '#ffffff', '#c77dff'];
  const shot = (x, y, n, spd) => { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, rot: Math.random() * 6, vr: rand(-10, 10), col: cols[i % cols.length], s: rand(5, 9), life: 0, max: rand(1.4, 2.4) }); } };
  if (kind === 'final') { for (let i = 0; i < 6; i++) setTimeout(() => shot(rand(0.15, 0.85) * c.width, rand(0.15, 0.5) * c.height, 90, 520), i * 380); }
  else if (kind === 'card') { shot(c.width / 2, c.height * 0.42, 140, 560); }
  else { shot(c.width * 0.3, c.height * 0.35, 60, 420); shot(c.width * 0.7, c.height * 0.35, 60, 420); }

  (function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    g.clearRect(0, 0, c.width, c.height);
    for (const p of parts) { p.life += dt; p.vy += 700 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.life > p.max) continue; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = Math.min(1, (p.max - p.life) * 2); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 + p.s * Math.abs(Math.cos(p.rot))); g.restore(); }
    if (now - start < (kind === 'final' ? 4800 : 2600)) requestAnimationFrame(tick); else c.remove();
  })(last);
}
/* 엘리베이터 문 연출 */
function elevatorDoors(code, place) {

  const d = document.createElement('div'); d.className = 'elev-doors';
  d.innerHTML = `<div class="ed l"></div><div class="ed r"></div><div class="ed-sign"><b>${esc(code)}</b><span>${esc(place)}</span></div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1700);
}

/* ---------- 입력 ---------- */
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
function press(dir) { G.keys = G.keys.filter(k => k !== dir); G.keys.push(dir); G.bumpKey = ''; }
function release(dir) { G.keys = G.keys.filter(k => k !== dir); }
window.addEventListener('keydown', e => {
  if (view !== 'room' || overlay) return;
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const d = KEYMAP[e.key];
  if (d) { e.preventDefault(); if (!e.repeat) press(d); }
  else if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') { e.preventDefault(); if (!e.repeat) interactFacing(); }

window.addEventListener('keyup', e => { const d = KEYMAP[e.key]; if (d) release(d); });
window.addEventListener('blur', () => { G.keys = []; });
app.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-dir]');
  if (b) { e.preventDefault(); press(b.dataset.dir); b.classList.add('on'); return; }

['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, () => { document.querySelectorAll('.pad .on').forEach(b => { release(b.dataset.dir); b.classList.remove('on'); }); }));

app.addEventListener('contextmenu', e => { if (e.target.closest('[data-dir]')) e.preventDefault(); });
